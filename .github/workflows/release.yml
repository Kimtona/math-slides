name: Release

# Builds the macOS (Apple Silicon) DMG for a version tag and attaches it to a DRAFT
# GitHub Release. Publishing is always a manual step. The app is signed ad-hoc ("-", set in
# package.json) and is NOT Developer-ID signed or notarized: no Apple credentials are used, so
# macOS asks for a one-time Privacy & Security → Open Anyway approval. The signature must still
# be VALID (a stale or missing bundle signature makes macOS say the app is "damaged"), so
# scripts/verify-macos-release.sh checks it strictly before anything is uploaded.
#
# Two jobs: `tests` (typecheck + full test suite) and `package` (DMG + draft release).
# Packaging does not wait for the tests to PASS, but it does wait for them to FINISH:
# a failing test run keeps the workflow red and is stated in the draft release notes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write # create the draft release; nothing else is needed

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  package:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      TEST_RESULT: ${{ needs.tests.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Refuse to touch an existing release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; refusing to modify it"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Package DMG (arm64, ad-hoc signed)
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Locate DMG
        run: |
          dmg="release/MathSlides-${VERSION}-arm64.dmg"
          test -f "$dmg" || { echo "::error::Expected $dmg was not produced"; ls -la release; exit 1; }
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 "$(basename "$DMG")" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          echo "SUMS=release/SHA256SUMS" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_ENV"

      - name: Verify DMG, signature and launch
        run: scripts/verify-macos-release.sh "$DMG" "$VERSION" "$SUMS"

      - name: Create draft release
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          if [ "$TEST_RESULT" = "success" ]; then
            tests_line="CI tests: passed."
          else
            tests_line="CI tests: NOT PASSED (result: $TEST_RESULT). See the Actions run before publishing this release."
          fi
          gh release create "$TAG" "$DMG" "$SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft $flags \
            --title "MathSlides $VERSION" \
            --notes "MathSlides $VERSION for macOS (Apple Silicon, macOS 13 or newer).

          This build is signed ad-hoc and is **not notarized by Apple**, so macOS asks for a one-time approval on first launch: open the app, then **System Settings → Privacy & Security → Open Anyway**. See the README for the steps.

          SHA-256 of the DMG (also in the attached \`SHA256SUMS\`): \`$DMG_SHA256\`

          $tests_line"

      - name: Verify the uploaded assets
        run: |
          set -euo pipefail
          dl="${RUNNER_TEMP:-/tmp}/uploaded"
          rm -rf "$dl"; mkdir -p "$dl"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dl" --pattern 'MathSlides-*.dmg' --pattern SHA256SUMS
          ( cd "$dl" && shasum -a 256 -c SHA256SUMS )
          cmp "$dl/$(basename "$DMG")" "$DMG"
          cmp "$dl/SHA256SUMS" "$SUMS"
          echo "Uploaded DMG and SHA256SUMS match the verified build."
